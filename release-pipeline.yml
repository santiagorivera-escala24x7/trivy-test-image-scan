trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  awsServiceConnection: 'AWSOps'
  awsRegion: 'us-east-1'
  ecrRepository: 'trivy-test-app'
  ecsCluster: 'trivy-test-cluster'
  ecsService: 'trivy-test-service'
  imageTag: '$(Build.BuildId)'
  dockerfilePath: 'docker/Dockerfile'
  dockerContext: 'docker'

steps:
# Single step using AWSShellScript to get credentials injected into the shell
- task: AWSShellScript@1
  displayName: 'Build, Scan, Push and Deploy'
  inputs:
    awsCredentials: '$(awsServiceConnection)'
    regionName: '$(awsRegion)'
    scriptType: 'inline'
    inlineScript: |
      set -e

      # Get account ID
      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/$(ecrRepository)"
      echo "Account ID: ${ACCOUNT_ID}"
      echo "ECR URI: ${ECR_URI}"

      # Login to ECR
      aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

      # Build Docker image
      docker build -t $(ecrRepository):$(imageTag) -f $(dockerfilePath) $(dockerContext)
      docker tag $(ecrRepository):$(imageTag) ${ECR_URI}:$(imageTag)
      docker tag $(ecrRepository):$(imageTag) ${ECR_URI}:latest

      # Install Trivy
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      trivy --version

      # Scan image - fail on CRITICAL/HIGH
      trivy image --exit-code 1 --severity CRITICAL,HIGH --no-progress $(ecrRepository):$(imageTag)

      # Push to ECR (only reaches here if scan passes)
      docker push ${ECR_URI}:$(imageTag)
      docker push ${ECR_URI}:latest

      # Update ECS service
      aws ecs update-service --cluster $(ecsCluster) --service $(ecsService) --force-new-deployment

      echo "Deployment complete!"
