trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  awsServiceConnection: 'AWSOps'
  awsRegion: 'us-east-1'
  ecrRepository: 'phoenix-test-app'
  ecsCluster: 'phoenix-test-cluster'
  ecsService: 'phoenix-test-service'
  imageTag: '$(Build.BuildId)'
  dockerfilePath: 'docker/Dockerfile'
  dockerContext: 'docker'

steps:
# Single step for AWSShellScript to get credentials injected into the shell
- task: AWSShellScript@1
  displayName: 'Build, Scan, Push and Deploy'
  inputs:
    awsCredentials: '$(awsServiceConnection)'
    regionName: '$(awsRegion)'
    scriptType: 'inline'
    inlineScript: |
      set -e

      # Get account ID
      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/$(ecrRepository)"
      echo "Account ID: ${ACCOUNT_ID}"
      echo "ECR URI: ${ECR_URI}"

      # Login to ECR
      aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

      # Build Docker image
      docker build -t $(ecrRepository):$(imageTag) -f $(dockerfilePath) $(dockerContext)
      docker tag $(ecrRepository):$(imageTag) ${ECR_URI}:$(imageTag)
      docker tag $(ecrRepository):$(imageTag) ${ECR_URI}:latest

      # Install Trivy
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      trivy --version

      # Download JUnit template
      mkdir -p contrib
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/master/contrib/junit.tpl -o contrib/junit.tpl

      # Generate report directory and timestamp
      DATETIME=$(date +"%Y-%m-%d-%H-%M-%S")
      mkdir -p reports

      # S3 bucket for Trivy reports
      BUCKET="azdo-test-bucket-cloudformation-sample"

      # Scan image - generate JUnit report (uses docker/trivy.yaml config)
      echo "Starting Trivy Scan"
      set +e
      trivy image --config docker/trivy.yaml --format template --template "@contrib/junit.tpl" \
        -o reports/trivyreport_${DATETIME}.xml \
        $(ecrRepository):$(imageTag)
      SCAN_EXIT=$?

      # Also generate JSON report
      trivy image --config docker/trivy.yaml --format json \
        -o reports/trivyreport_${DATETIME}.json \
        $(ecrRepository):$(imageTag) || true
      set -e

      # Print scan results to pipeline logs
      echo ""
      echo "========== TRIVY IMAGE SCAN RESULTS =========="
      trivy image --config docker/trivy.yaml $(ecrRepository):$(imageTag) || true
      echo "========================================"
      echo ""

      # Scan CloudFormation templates (uses phoenix-pipeline-test/trivy.yaml config)
      echo ""
      echo "========== TRIVY IaC SCAN (CloudFormation) =========="
      trivy config --config phoenix-pipeline-test/trivy.yaml \
        -o reports/trivy_iac_report_${DATETIME}.json --format json \
        phoenix-pipeline-test/ || true
      trivy config --config phoenix-pipeline-test/trivy.yaml phoenix-pipeline-test/ || true
      echo "====================================================="
      echo ""

      # Upload all reports to S3
      aws s3 cp reports/ s3://${BUCKET}/trivy/ --recursive --exclude "*" --include "trivy*"

      # Fail the build if Trivy found CRITICAL/HIGH
      if [ $SCAN_EXIT -ne 0 ]; then
        echo "Trivy found CRITICAL/HIGH vulnerabilities. Failing build."
        exit 1
      fi

      # Push to ECR (only reaches here if scan passes)
      docker push ${ECR_URI}:$(imageTag)
      docker push ${ECR_URI}:latest

      # Register new task definition revision with the new image
      TASK_FAMILY="phoenix-test-task"
      CURRENT_TASK_DEF=$(aws ecs describe-task-definition --task-definition ${TASK_FAMILY} --query 'taskDefinition' --output json)

      # Update the image in the container definition and register new revision
      NEW_TASK_DEF=$(echo ${CURRENT_TASK_DEF} | jq \
        --arg IMAGE "${ECR_URI}:$(imageTag)" \
        '.containerDefinitions[0].image = $IMAGE | {family: .family, networkMode: .networkMode, requiresCompatibilities: .requiresCompatibilities, cpu: .cpu, memory: .memory, executionRoleArn: .executionRoleArn, taskRoleArn: .taskRoleArn, containerDefinitions: .containerDefinitions}')

      NEW_REVISION=$(aws ecs register-task-definition --cli-input-json "${NEW_TASK_DEF}" --query 'taskDefinition.taskDefinitionArn' --output text)
      echo "New task definition: ${NEW_REVISION}"

      # Update ECS service to use the new task definition
      aws ecs update-service --cluster $(ecsCluster) --service $(ecsService) --task-definition ${NEW_REVISION} --force-new-deployment

      echo "Deployment complete!"

